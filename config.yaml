# --- TGE / airdrop -------------------------------------------------------------
# Анонси з'являються в X, який безкоштовно не читається. Бот шукає те, що за кілька годин потрапляє у відкритий
# веб: Google News і Bing News (передруки, лістинги бірж; Bing бачить більше дрібних крипто-сайтів, напр. KuCoin
# flash), публічні Telegram-канали новин і бірж, нові сторінки в документації проєктів.
# Повідомлення — коли текст називає проєкт (name/aliases) І містить ключове слово. Перший прохід кожного джерела тихий.
# Статуси нижче — станом на 20.10.2026; відредагуйте, коли щось зміниться.
tge:
  check_hours: 2            # як часто перевіряти Google/Bing News і docs
  telegram_check_hours: 0.2 # Telegram-канали — щозапуску (Foresight News пише ~11 постів/год, t.me/s віддає 20)
  news_days: 14             # Google News: шукати за останні N днів
  max_age_days: 7           # старші статті не надсилати
  fail_alert_checks: 6      # джерело новин не відповідає 6 перевірок поспіль (~12 год) → одне повідомлення
  telegram_fail_alert_checks: 12   # для Telegram-каналів (перевіряються частіше) — ~3 год
  news_engines: [gnews, bing]
  remind_days: [7, 1]       # нагадування до дати, заданої через /tge (+ у день TGE)
  keywords: [TGE, "token generation", "token launch", airdrop, claim, claiming, snapshot, tokenomics, listing,
             "will list", launchpool, launchpad, megadrop, HODLer, "pre-market", premarket, booster, "Binance Alpha",
             "allocation checker", season,
             空投, 代币经济学, 代币生成, 代币发行, 发币, 快照, 领取, 上市]   # китайські — для Foresight News / BlockBeats
  news_keywords: [TGE, airdrop, tokenomics, token, listing, claim, snapshot, season]   # для запиту в Google News
  # публічні канали (t.me/s/<назва> відкривається в браузері), перевірено 20.10.2026; можна додати свої
  telegram_channels: [wublockchainenglish, binance_announcements, Bybit_Announcements, foresightnews, theblockbeats]
  projects:
    saturn:
      name: Saturn
      ticker: STRN
      short: [sat, strn]
      expected: "Q4 2026"
      status: "STRN: TGE заплановано на Q4 2026 (анонс 25.09), точної дати немає. Snapshot сезону 2 (до 5% supply)
        — перед TGE, якщо TGE до 08.12.2026. За повідомленнями від 25.09 allocation checker працює, claim ще не відкритий."
      hint: "Snapshot сезону 2 Saturn робиться перед TGE — позиції в Saturn до snapshot не чіпати."
      aliases: ["Saturn Credit", "Saturn Labs", "Saturn Foundation", STRN, STRNUSDT, USDat, sUSDat]
      news_query: '"Saturn" ("STRN" OR "USDat" OR "sUSDat" OR "Saturn Credit")'   # лапки = точний збіг у Google
      bing_queries: ["Saturn STRN", "Saturn USDat"]   # Bing: лише прості запити, ключові слова фільтрує бот
      exclude: [Oil, Gas, NASA, planet, rocket, Cassini, moon]   # Saturn Oil & Gas, ракета, планета
      docs_sitemap: https://docs.saturn.credit/sitemap.xml
    unitas:
      name: Unitas
      ticker: UP
      short: [uni, up]
      expected: "TGE відбувся 13.03.2026 ($UP)"
      status: "$UP уже вийшов: TGE 13.03.2026 через Binance Wallet. Стежу за новими сезонами й розподілами."
      aliases: [Unitas, "Unitas Labs", USDu, sUSDu]
      news_query: '"Unitas" ("USDu" OR "sUSDu" OR "Unitas Labs")'
      bing_queries: ["Unitas USDu", "Unitas Labs"]
      exclude: [Johnny, Colts, NFL, football, quarterback]   # «Unitas» — ще й футболіст Johnny Unitas
      docs_sitemap: https://docs.unitas.so/sitemap.xml
    infinifi:
      name: infiniFi
      ticker: INFI
      short: [inf, infi]
      expected: "Q4 2026"
      status: "INFI: TGE у Q4 2026, точної дати немає. Токеноміка 14.10: 45% екосистема (з неї airdrop),
        20% команда, 20% інвестори, 15% фонд. Claim-сторінки ще немає."
      aliases: [infiniFi, INFI, INFIUSDT, siUSD, liUSD]
      news_query: '"infiniFi"'
      bing_queries: [infiniFi]
      docs_ignore: [/dev-docs/]   # технічні сторінки про iUSD/siUSD/liUSD — не анонс токена
      docs_sitemap: https://docs.infinifi.xyz/sitemap.xml
    tori:
      name: Tori
      ticker: ""
      short: [tori, cores]
      expected: "не оголошено"
      status: "Токен не анонсовано. Поінти Cores, сезон 1 з 23.06.2026, кінець сезону не оголошено."
      aliases: ["Tori Finance", trUSD, strUSD, "Tori Cores"]
      news_query: '("Tori Finance" OR "trUSD")'
      bing_queries: ['"Tori Finance"', trUSD]
      strict_title: true   # у заголовку новини потрібен alias: «Tori» без Finance — це й Tori Dunlap, Tori Amos
      docs_sitemap: https://docs.tori.finance/sitemap.xml

# --- Безпека: залежності й ознаки зламу ------------------------------------------
# Три шари (докладно — README, «Безпека»):
#  1) on-chain ваших протоколів, кожен запуск: оновлення proxy / owner / minter, пауза, стрибок емісії;
#  2) виміряні залежності: ціни стейблкоїнів-залежностей, TVL DeFi-протоколів (щогодини), фарми infiniFi;
#  3) новини: слово «hack/exploit/被盗…» + назва вашого проєкту чи його залежності.
# Залежності зібрано з документації проєктів, Pharos і on-chain станом на 22.10.2026.
security:
  enabled: true
  rescan_hours: 24                # повна перевірка, які proxy/пауза/owner у контракту є
  supply:
    jump_warn_pct: 10             # емісія стейбла +10% за один запуск → увага
    jump_alarm_pct: 50            # +50% → тривога (безконтрольний мінт)
    drop_warn_pct: 15             # −15% за 24 год → увага (масовий вихід)
    drop_alarm_pct: 30
  stables:
    warn_below: 0.99
    alarm_below: 0.97
  tvl_check_hours: 1
  dep_tvl:
    window_hours: 6
    warn_drop_pct: 25             # TVL залежності −25% за 6 год → увага
    alarm_drop_pct: 40
  coins_url: https://coins.llama.fi
  infinifi_farms:
    enabled: true
    check_hours: 1
    # назви фармів — з deployment-файлу infiniFi (адреса → FARM_AAVEV3, FARM_PENDLEV3_RUSD_30OCT25, …)
    names_url: https://raw.githubusercontent.com/InfiniFi-Labs/infinifi-protocol/master/deployment/configuration/addresses.1.json
    rules:                        # частина назви фарма → залежність
      - [AAVE, aave]
      - [SGHO, aave]
      - [MORPHO, morpho]
      - [EULER, euler]
      - [FLUID, fluid]
      - [SPARK, spark]
      - [ETHENA, ethena]
      - [SUSDE, ethena]
      - [EUSDE, ethena]
      - [TUSDE, ethena]
      - [SRUSDE, ethena]
      - [MAPLE, maple]
      - [SYRUPUSDC, maple]
      - [MIDAS, midas]
      - [FASANARA, fasanara]
      - [FALCONX, falconx]
      - [PARETO, falconx]
      - [CAP, cap]
      - [CUSD, cap]
      - [STCUSD, cap]
      - [RESERVOIR, reservoir]
      - [RUSD, reservoir]
      - [LEVEL, level]
      - [FXSAVE, fx]
      - [OUTLAND, bridges]
      - [PENDLE, pendle]          # PT інших протоколів — Pendle як місце; базовий актив — у назві
      - [GAUNTLET, gauntlet]
      - [STRCX, strategy]

  news:
    check_hours: 0.2              # Telegram і RSS — щозапуску
    search_check_hours: 1         # Bing і пошук по ваших проєктах — щогодини
    max_age_hours: 48
    cooldown_hours: 12            # той самий об'єкт — не частіше раз на 12 год (решта згадок — у /security)
    fail_alert_checks: 12
    # Telegram: ті самі канали, що й для TGE (tge.telegram_channels) — сторінки читаються один раз за запуск
    rss:
      - https://cointelegraph.com/rss
      - https://www.theblock.co/rss.xml
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://decrypt.co/feed
      - https://rekt.news/rss/feed.xml
    gnews_queries: ['(crypto OR DeFi OR stablecoin OR protocol)']
    bing_queries: ["crypto exploit", "DeFi hack", "stablecoin depeg"]
    search_keywords: [hack, hacked, exploit, exploited, drained, attack, "security incident", depeg]
  hack_keywords: [hack, hacked, hacker, hackers, exploit, exploited, exploiter, drained, drains, attack, attacked,
                  attacker, compromised, stolen, theft, breach, breached, vulnerability, "security incident",
                  "suspicious transaction", "suspicious transactions", "suspicious activity", "rug pull", insolvent,
                  insolvency, depeg, depegged, "de-peg", "withdrawals paused", "paused withdrawals",
                  被盗, 被黑, 黑客, 攻击, 遭攻击, 漏洞, 脱锚, 安全事件, 盗取, 异常交易]
  # для «широких» назв (Binance, USDC, Solana…): слово має йти одразу за назвою — «Bybit hacked», а не
  # «hacker sent funds to Binance»
  strong_keywords: [hack, hacked, exploit, exploited, drained, breach, breached, compromised, insolvent, insolvency,
                    depeg, depegged, "security incident", "suffers", 被盗, 被黑, 遭攻击, 黑客攻击, 脱锚, 安全事件]

