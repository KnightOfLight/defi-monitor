    coins_url: https://coins.llama.fi   # резервна ціна trUSD

  rpc:
    # Публічні RPC за замовчуванням. Якщо задати секрети ETH_RPC_URL / BSC_RPC_URL,
    # вони стануть першими в списку (решта — резерв).
    ethereum:
      - https://ethereum-rpc.publicnode.com
      - https://eth.llamarpc.com
    bsc:
      - https://bsc-rpc.publicnode.com
      - https://binance.llamarpc.com

