# ============================================================
#  config.yaml — усі пороги й адреси. Код правити не потрібно.
#  Секрети (токен бота, chat id, RPC) сюди НЕ пишіть — вони в GitHub Secrets.
# ============================================================

timezone: Europe/Kyiv

# --- П'ятничний дайджест і суботнє нагадування -------------------------------
weekly:
  weekday: 4            # 0 = понеділок … 4 = п'ятниця
  hour: 10              # година за Києвом (воркфлоу запускається о 07:00 і 08:00 UTC,
                        # код сам обирає той запуск, що припадає на 10:xx за Києвом)
  reminder_weekday: 5   # субота: нагадати, якщо поінти не записані

# --- Алерти -------------------------------------------------------------------
alerts:
  repeat_hours: 6       # повтор алерту, поки умова тримається
  warmup_days: 7        # перші N днів збираємо базу, алерти шлемо лише по цінах
  warmup_suppress: [tvl, infinifi]   # що глушити під час warm-up (ціни, Pendle і погашення — ніколи)
  source_error_runs: 3  # повідомити, якщо джерело не відповідає N запусків поспіль

  price:
    warn_below: 0.995         # «увага» (на двох перевірках поспіль)
    warn_consecutive: 2
    alarm_below:              # «тривога» — одразу
      usdat: 0.985
      usdu: 0.98
      iusd: 0.985
      trusd: 0.985            # trUSD — синтетичний долар (дельта-нейтральні стратегії), як USDe

  tvl:
    warn_drop_7d_pct: 20      # увага: −20% за 7 днів
    alarm_drop_24h_pct: 30    # тривога: −30% за 24 години
    saturn_high_usd: 800000000  # окреме повідомлення, коли TVL Saturn > $800 млн

  pendle:                     # ринок Pendle trUSD (sources.ethereum.pendle_trusd_market)
    pt_drop_24h_warn_pct: 0.5   # PT-trUSD подешевшав (у trUSD) на 0.5% за 24 год → увага
    pt_drop_24h_alarm_pct: 1.5  # … на 1.5% → тривога. У нормі PT щодня лише дорожчає до 1.0
    implied_apy_warn_pct: 30    # implied APY > 30% на двох перевірках поспіль → увага
    apy_ignore_last_days: 7     # за 7 днів до погашення APY стає шумним — алерт по APY вимкнено
    liquidity_drop_24h_warn_pct: 25
    liquidity_drop_7d_warn_pct: 30
    maturity_remind_days: [14, 7, 2]   # нагадати про погашення за N днів (+ у день погашення)
    new_market_check_hours: 24  # як часто шукати новий ринок trUSD на Pendle (для перекладу після погашення)

  tori:
    rate_drop_tolerance: 0.000001   # будь-яке падіння курсу strUSD (= списаний збиток) → тривога

  infinifi:
    reserve_warn_pct: 5       # ліквідний резерв < 5% TVL …
    reserve_warn_days: 3      # … три дні поспіль → увага
    queue_alarm_hours: 48     # черга redemption не порожня понад 48 год → тривога
    rate_drop_tolerance: 0.000001   # відносний допуск при порівнянні exchange rate

# --- Джерела даних ------------------------------------------------------------
sources:
  defillama:
    base_url: https://api.llama.fi
    slugs:                    # перевірено 09.10.2026 на defillama.com/protocol/<slug>
      saturn: saturn
      unitas: unitas-usdu     # дочірній протокол «Unitas USDu»; батьківський (BSC+Solana разом) — unitas
      infinifi: infinifi
      tori: tori-finance      # перевірено 20.10.2026: Tori Finance, Basis Trading, Ethereum
    coins_url: https://coins.llama.fi   # резервна ціна trUSD

  rpc:
    # Публічні RPC за замовчуванням. Якщо задати секрети ETH_RPC_URL / BSC_RPC_URL,
    # вони стануть першими в списку (решта — резерв).
    ethereum:
      - https://ethereum-rpc.publicnode.com
      - https://eth.llamarpc.com
    bsc:
      - https://bsc-rpc.publicnode.com
      - https://binance.llamarpc.com

  ethereum:
    usdc_token:        "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    usdat_token:       "0x23238f20b894f29041f48d88ee91131c395aaa71"
    curve_usdat_pool:  "0xf4d0cf32908b2c7f1021339c43df0f77f06896d7"   # Curve USDC/USDat (лише ціна USDat)
    iusd_token:        "0x48f9e38f3070AD8945DFEae3FA70987722E3D89c"
    curve_iusd_pool:   "0x2e2d6c119bdf226c420cb40e3b9fc9689cf5986e"   # Curve iUSD/USDC (~$10K ліквідності!)
    infinifi_gateway:  "0x3f04b65Ddbd87f9CE0A2e7Eb24d80e7fb87625b5"   # Gateway V1 (docs.infinifi.xyz)
    liusd13w_token:    "0xbd3f9814eB946E617f1d774A6762cDbec0bf087A"   # для self-test
    liusd_bucket_weeks: 13
    # Tori (перевірено 20.10.2026: DefiLlama, CoinGecko, Pendle API, github.com/Tori-Finance/tori-contracts)
    trusd_token:       "0xd0580192E98eA6CEB9c7b6191Ed2E27560911697"
    strusd_token:      "0x280839980a7eD0D7717F64125fE241012E5F5815"   # Staked trUSD, ERC-4626, cooldown 7 дн
    curve_trusd_pool:  "0xd1d954bc94c843815ec7b8119f2de00af27fa6ff"   # Curve frxUSD/trUSD (ціна trUSD у frxUSD)
    pendle_trusd_market: "0xfcf009cb3135da12a6eb1f73f3ee05392a7bc947" # Pendle trUSD 26NOV2026
    pendle_trusd_pt:   "0x7191878f1fe834b28f4d0cead0e4375b814c4abb"   # PT-trUSD-26NOV2026 (для self-test)

  bsc:
    usdu_token:        "0xea953ea6634d55dac6697c436b1e81a679db5882"
    usdt_token:        "0x55d398326f99059fF775485246999027B3197955"
    pancake_usdu_pool: "0x8aab5522d601bbb85501d703b55a272e47852120"   # PancakeSwap V3 USDu/USDT 0.01%

  # Скільки токенів «продати» в пулі, щоб отримати ціну (через get_dy).
  # Для USDat пул ~$6.7M → 1000 ок; для iUSD пул ~$10K → лише 100.
  probe_amounts:
    usdat: 1000
    iusd: 100
    trusd: 1000             # пул frxUSD/trUSD має ~$60 тис. глибини на ±2% — 1000 ок

  pendle:
    api_url: https://api-v2.pendle.finance/core   # резерв для ринку + пошук нових ринків trUSD
    chain_id: 1

  geckoterminal:
    base_url: https://api.geckoterminal.com/api/v2   # резерв для ціни USDu і для tools/find_pools.py

# --- TGE / airdrop -------------------------------------------------------------
# Анонси з'являються в X, який безкоштовно не читається. Бот шукає те, що за кілька годин потрапляє у відкритий
# веб: Google News і Bing News (передруки, лістинги бірж; Bing бачить більше дрібних крипто-сайтів, напр. KuCoin
# flash), публічні Telegram-канали новин і бірж, нові сторінки в документації проєктів.
# Повідомлення — коли текст називає проєкт (name/aliases) І містить ключове слово. Перший прохід кожного джерела тихий.
# Статуси нижче — станом на 20.10.2026; відредагуйте, коли щось зміниться.
tge:
  check_hours: 2            # як часто перевіряти Google/Bing News і docs
  telegram_check_hours: 0.2 # Telegram-канали — щозапуску (Foresight News пише ~11 постів/год, t.me/s віддає 20)
  news_days: 14             # Google News: шукати за останні N днів
  max_age_days: 7           # старші статті не надсилати
  fail_alert_checks: 6      # джерело новин не відповідає 6 перевірок поспіль (~12 год) → одне повідомлення
  telegram_fail_alert_checks: 12   # для Telegram-каналів (перевіряються частіше) — ~3 год
  news_engines: [gnews, bing]
  remind_days: [7, 1]       # нагадування до дати, заданої через /tge (+ у день TGE)
  keywords: [TGE, "token generation", "token launch", airdrop, claim, claiming, snapshot, tokenomics, listing,
             "will list", launchpool, launchpad, megadrop, HODLer, "pre-market", premarket, booster, "Binance Alpha",
             "allocation checker", season,
             空投, 代币经济学, 代币生成, 代币发行, 发币, 快照, 领取, 上市]   # китайські — для Foresight News / BlockBeats
  news_keywords: [TGE, airdrop, tokenomics, token, listing, claim, snapshot, season]   # для запиту в Google News
  # публічні канали (t.me/s/<назва> відкривається в браузері), перевірено 20.10.2026; можна додати свої
  telegram_channels: [wublockchainenglish, binance_announcements, Bybit_Announcements, foresightnews, theblockbeats]
  projects:
    saturn:
      name: Saturn
      ticker: STRN
      short: [sat, strn]
      expected: "Q4 2026"
      status: "STRN: TGE заплановано на Q4 2026 (анонс 25.09), точної дати немає. Snapshot сезону 2 (до 5% supply)
        — перед TGE, якщо TGE до 08.12.2026. За повідомленнями від 25.09 allocation checker працює, claim ще не відкритий."
      hint: "Snapshot сезону 2 Saturn робиться перед TGE — позиції в Saturn до snapshot не чіпати."
      aliases: ["Saturn Credit", "Saturn Labs", "Saturn Foundation", STRN, STRNUSDT, USDat, sUSDat]
      news_query: 'Saturn (STRN OR USDat OR sUSDat OR "Saturn Credit")'
      docs_sitemap: https://docs.saturn.credit/sitemap.xml
    unitas:
      name: Unitas
      ticker: UP
      short: [uni, up]
      expected: "TGE відбувся 13.03.2026 ($UP)"
      status: "$UP уже вийшов: TGE 13.03.2026 через Binance Wallet. Стежу за новими сезонами й розподілами."
      aliases: [Unitas, "Unitas Labs", USDu, sUSDu]
      news_query: 'Unitas (USDu OR sUSDu OR "Unitas Labs")'
      exclude: [Johnny, Colts, NFL, football, quarterback]   # «Unitas» — ще й футболіст Johnny Unitas
      docs_sitemap: https://docs.unitas.so/sitemap.xml
    infinifi:
      name: infiniFi
      ticker: INFI
      short: [inf, infi]
      expected: "Q4 2026"
      status: "INFI: TGE у Q4 2026, точної дати немає. Токеноміка 14.10: 45% екосистема (з неї airdrop),
        20% команда, 20% інвестори, 15% фонд. Claim-сторінки ще немає."
      aliases: [infiniFi, INFI, INFIUSDT, siUSD, liUSD]
      news_query: infiniFi
      docs_sitemap: https://docs.infinifi.xyz/sitemap.xml
    tori:
      name: Tori
      ticker: ""
      short: [tori, cores]
      expected: "не оголошено"
      status: "Токен не анонсовано. Поінти Cores, сезон 1 з 23.06.2026, кінець сезону не оголошено."
      aliases: ["Tori Finance", trUSD, strUSD, "Tori Cores"]
      news_query: '("Tori Finance" OR trUSD)'
      docs_sitemap: https://docs.tori.finance/sitemap.xml

# --- Файли стану ---------------------------------------------------------------
files:
  journal: data/journal.csv
  history: data/history.csv
  state: data/state.json
  history_keep_days: 10
